

services:
  java_app:
    build: 
      context: .
    container_name: expensesapp
    ports:
      - "8080:8080"
    networks:
      - expense
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_db:3306/expenses_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Test@123
    restart: always
    depends_on:
      mysql_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD","curl","-f", "http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  mysql_db:
    image: mysql
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "Test@123"
      MYSQL_DATABASE: "expenses_tracker"
    networks:
      - expense
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-pTest@123","-uroot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  expense:
volumes:
  mysql_data:
